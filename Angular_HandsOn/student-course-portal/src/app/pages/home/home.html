<div class="home">
  <h1>{{ portalName }}</h1>

  <p>Welcome to the Student Course Portal.</p>

  <div class="stats">
    <p><strong>Courses Available:</strong> {{ coursesAvailable }}</p>
    <p><strong>Enrolled:</strong> {{ enrolled }}</p>
    <p><strong>GPA:</strong> {{ gpa }}</p>
  </div>

  <button
    [disabled]="!isPortalActive"
    (click)="onEnrollClick()">
    Enroll Now
  </button>

  <p>{{ message }}</p>

  <br>

  <input
    type="text"
    [(ngModel)]="searchTerm"
    placeholder="Search courses">

  <p>Searching for: {{ searchTerm }}</p>
</div>
