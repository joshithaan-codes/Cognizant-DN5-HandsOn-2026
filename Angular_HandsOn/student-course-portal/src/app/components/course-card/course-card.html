<div
  class="course-card"
  [ngClass]="cardClasses"
  [ngStyle]="{'border-left-color': borderColor}">

  <h2>{{ course.name | uppercase }}</h2>

  <p><strong>ID:</strong> {{ course.id }}</p>
  <p><strong>Code:</strong> {{ course.code }}</p>
  <p><strong>Credits:</strong> {{ course.credits | creditLabel }}</p>

  <div [ngSwitch]="course.gradeStatus">
    <span *ngSwitchCase="'passed'" class="passed">Passed</span>
    <span *ngSwitchCase="'failed'" class="failed">Failed</span>
    <span *ngSwitchDefault class="pending">Pending</span>
  </div>

  <br>

  <button (click)="toggleEnrollment()">
  {{ isEnrolled ? 'Unenroll' : 'Enroll' }}
</button>

  <button (click)="toggleDetails()">
    {{ isExpanded ? 'Hide Details' : 'Show Details' }}
  </button>

  <p *ngIf="isExpanded">
    Course {{ course.code }} carries {{ course.credits }} credits.
  </p>

</div>
